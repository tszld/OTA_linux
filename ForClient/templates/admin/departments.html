{% extends "base.html" %}
{% block title %}部门管理{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>部门管理</h3>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">新建部门</button>
</div>

{% if departments %}
<table class="table table-hover">
    <thead>
        <tr>
            <th>部门名称</th>
            <th>创建时间</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for dept in departments %}
        <tr>
            <td>{{ dept.name }}</td>
            <td>{{ dept.created_at }}</td>
            <td>
                <form method="POST" action="{{ url_for('admin.delete_department', dept_id=dept.id) }}" class="d-inline"
                      onsubmit="return confirm('确认删除部门「{{ dept.name }}」？')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">删除</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<div class="text-muted mt-3">暂无部门</div>
{% endif %}

<!-- 新建部门模态框 -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('admin.create_department') }}">
                <div class="modal-header">
                    <h5 class="modal-title">新建部门</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="name" class="form-label">部门名称</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="如：北京朝阳营业厅" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">创建</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
