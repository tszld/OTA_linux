{% extends "base.html" %}
{% block title %}注册 - 文档管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header text-center">
                <h4>部门管理员注册</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="phone" class="form-label">手机号</label>
                        <input type="text" class="form-control" id="phone" name="phone"
                               value="{{ phone|default('') }}" placeholder="请输入手机号" required>
                    </div>
                    <div class="mb-3">
                        <label for="code" class="form-label">验证码</label>
                        <input type="text" class="form-control" id="code" name="code"
                               placeholder="请输入验证码" required>
                        <div class="form-text">开发阶段验证码固定为 123456</div>
                    </div>
                    <div class="mb-3">
                        <label for="dept_id" class="form-label">所属部门</label>
                        <select class="form-select" id="dept_id" name="dept_id" required>
                            <option value="">请选择部门</option>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}" {% if dept_id|default('') == dept.id|string %}selected{% endif %}>{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">如果没有您的部门，请联系管理员添加</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">注册</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.login') }}">已有账号？去登录</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
